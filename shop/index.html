<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shop - XGEREMY™</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="https://i.imgur.com/cFOFY4I.png">
<style>
:root{--font:'Helvetica Neue',Helvetica,Arial,sans-serif;--bg:#050505;--text:#f5f5f7;--text-2:#86868b}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
a.back-link{position:fixed;top:20px;left:20px;z-index:9999;color:var(--text-2);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:-.01em;opacity:.55;transition:opacity .25s}
a.back-link:hover{opacity:1}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 28px}
.intro-title{font-family:var(--font);font-size:clamp(28px,7vw,46px);font-weight:700;letter-spacing:-.035em;line-height:1.12;text-transform:uppercase}
</style>
</head>
<body>
<a href="/" class="back-link">← Inicio</a>
<section class="screen">
  <h1 class="intro-title">PRÓXIMAMENTE</h1>
</section>
</body>
</html>
