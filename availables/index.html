<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Diseños disponibles — Sketchbook | XGEREMY™</title>
<meta name="description" content="Sketchbook de diseños de tatuajes disponibles de XGEREMY. Blackwork, dotwork y fine line en Viña del Mar y Valparaíso.">
<meta name="theme-color" content="#050505">
<link rel="canonical" href="https://xgeremy.work/availables">
<link rel="icon" type="image/png" href="https://i.imgur.com/cFOFY4I.png">
<style>
  :root{
    --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --bg:#050505;
    --bg-2:#0f0f0f;
    --text:#f5f5f7;
    --text-2:#86868b;
    --paper:#f3efe6;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;background:var(--bg);
    font-family:var(--font);color:var(--text);-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;touch-action:none;-webkit-font-smoothing:antialiased}
  a.back{
    position:fixed;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));
    z-index:7000;color:var(--text);text-decoration:none;font-family:var(--font);
    font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    opacity:.55;transition:opacity .25s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  a.back:hover{opacity:1}
  .stage{
    position:fixed;inset:0;overflow:hidden;
    touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;-webkit-user-drag:none;
    background:var(--bg);
  }
  .stage.drag{cursor:grabbing}
  /* sombra suave sin filter:blur (caro en iPhone) */
  .stage::after{
    content:"";position:absolute;left:50%;top:56%;width:min(88vw,480px);height:22%;
    transform:translate(-50%,0);pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,.5) 0%, rgba(0,0,0,.15) 50%, transparent 70%);
  }
  .leaf{
    position:absolute;left:0;top:0;width:720px;height:1152px;
    transform-origin:0 0;
    overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background-color:var(--paper);
  }
  .leaf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    pointer-events:none;-webkit-user-drag:none;-webkit-touch-callout:none;z-index:1}
  .leaf .sh{position:absolute;inset:0;pointer-events:none;z-index:2}
  .leaf .lit{position:absolute;inset:0;pointer-events:none;z-index:3}
  .leaf .edge{position:absolute;inset:0;pointer-events:none;z-index:4;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .leaf.empty{display:grid;place-items:center;font-family:var(--font);font-size:160px;font-weight:700;color:rgba(70,55,30,.2)}
  .leaf.empty .sh,.leaf.empty .lit,.leaf.empty .edge{z-index:1}
  .dbg .leaf{outline:10px solid rgba(255,40,40,.9);outline-offset:-10px}
  .ref{position:absolute;left:0;top:0;pointer-events:none;z-index:5000;display:none}
  .hint,.count{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));z-index:6000;
    font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-2);pointer-events:none}
  .hint{left:max(16px,env(safe-area-inset-left));opacity:.75;transition:opacity .6s}
  .hint.off{opacity:0}
  .count{right:max(16px,env(safe-area-inset-right));opacity:.75;font-variant-numeric:tabular-nums;color:var(--text)}
  /* lightbox — diseño a pantalla completa */
  .lb{
    position:fixed;inset:0;z-index:8000;display:flex;align-items:center;justify-content:center;
    background:rgba(10,10,12,.92);padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    opacity:0;pointer-events:none;transition:opacity .28s ease;
    -webkit-tap-highlight-color:transparent;touch-action:none;
  }
  .lb.on{opacity:1;pointer-events:auto}
  .lb img{
    max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
    border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.45);
    background:var(--paper);user-select:none;-webkit-user-drag:none;
  }
  .lb-close{
    position:absolute;top:max(14px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));
    width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:28px;line-height:1;
    cursor:pointer;opacity:.7;font-family:inherit;-webkit-tap-highlight-color:transparent;
  }
  .lb-close:hover{opacity:1}
  .lb-cap{
    position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;
    text-align:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:rgba(255,255,255,.55);pointer-events:none;
  }
</style>
</head>
<body>
<a class="back" href="/">← Inicio</a>
<div class="stage" id="stage"></div>
<div class="hint" id="hint">Swipe · Toca para ampliar</div>
<div class="count" id="count"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Diseño ampliado" hidden>
  <button type="button" class="lb-close" id="lbClose" aria-label="Cerrar">×</button>
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
</div>
<script>
/* ================= CONFIG ================= */
const TOTAL_PAGES = 13;
const src   = n => `img/p${String(n).padStart(2,'0')}.jpg`;
const START = 0;                         // abre en página 1
const SCALE_DESKTOP = 1;
const SCALE_MOBILE = 1.55;               // más grande en teléfono
const CENTER_BOOK = true;
const PAGE_W = 720, PAGE_H = 1152;
const RADIUS = 54;
const SPRING_K = 200;                    // más rápido / snappy en iPhone
const SPRING_C = 28;                     // amortiguación ~crítica (2√K≈28)
const FLICK_T  = 0.12;
const MAX_JUMP = 2;
/* ========================================== */
const REF_W = 475, REF_H = 295, SPINE_X = 255.5, BOOK_CY = 148;
const SH_POS = [0, .02, .5, .98, 1];
const BASE = [
  {x0: 26,   x1: 39.5, tl: 61.9, tr: 59.2, bl: 231.9, br: 235.9, sh:[.33 ,.33 ,.33 ,.33 ,.33 ]},
  {x0: 39.5, x1: 61,   tl: 59.2, tr: 54.0, bl: 235.9, br: 242.1, sh:[.245,.24 ,.22 ,.205,.20 ]},
  {x0: 61,   x1: 73,   tl: 52.7, tr: 51.4, bl: 243.5, br: 243.5, sh:[.10 ,.10 ,.10 ,.10 ,.10 ]},
  {x0: 73,   x1: 89.5, tl: 49.8, tr: 47.3, bl: 245.0, br: 248.8, sh:[.10 ,.10 ,.11 ,.12 ,.12 ]},
  {x0: 89.5, x1: 122.5,tl: 44.7, tr: 42.3, bl: 250.2, br: 253.7, sh:[.20 ,.20 ,.195,.185,.185]},
  /* L0 / R0: AO fuerte en el lomo (gutter) como en la foto real */
  {x0: 122.5,x1: 255.5,tl: 34.3, tr: 41.8, bl: 262.5, br: 254.3, sh:[.06 ,.08 ,.14 ,.22 ,.42 ]},
  {x0: 255.5,x1: 389.5,tl: 41.7, tr: 33.0, bl: 254.3, br: 263.1, sh:[.40 ,.18 ,.08 ,.04 ,.03 ]},
  {x0: 389.5,x1: 425.5,tl: 42.3, tr: 45.8, bl: 253.7, br: 250.3, sh:[.14 ,.12 ,.06 ,.02 ,0   ]},
  {x0: 425.5,x1: 441.5,tl: 46.9, tr: 50.9, bl: 249.3, br: 244.0, sh:[0   ,0   ,0   ,0   ,0   ]},
  {x0: 441.5,x1: 457.5,tl: 50.9, tr: 54.9, bl: 244.1, br: 240.1, sh:[.04 ,.04 ,.03 ,.02 ,.02 ]},
  {x0: 457.5,x1: 473.5,tl: 54.9, tr: 58.9, bl: 241.1, br: 237.1, sh:[.18 ,.18 ,.14 ,.09 ,.08 ]},
];
const BASE_L0 = 5;
const EXT = 2;                           // menos hojas extremas = menos estiramiento
const MIN_SLOT_W = 28;                   // oculta ranuras demasiado finas (evita alargar el dibujo)
const leftExt = [], rightExt = [];
{
  let o = BASE[0];
  for (let n = 1; n <= EXT; n++){
    const s = {x1: o.x0, x0: o.x0 - 13, tr: o.tl, tl: o.tl + 2.7, br: o.bl, bl: o.bl - 4.0,
               sh: o.sh.map(a => Math.min(.5, a + .03)), op: Math.max(0, 1 - n / (EXT + 1))};
    leftExt.unshift(s); o = s;
  }
  o = BASE[BASE.length - 1];
  for (let n = 1; n <= EXT; n++){
    const s = {x0: o.x1, x1: o.x1 + 16, tl: o.tr, tr: o.tr + 4.0, bl: o.br, br: o.br - 4.0,
               sh: o.sh.map(a => Math.min(.5, a + .03)), op: Math.max(0, 1 - n / (EXT + 1))};
    rightExt.push(s); o = s;
  }
}
const ALL = [...leftExt, ...BASE.map(b => ({...b, op: 1})), ...rightExt];
const IDX_L0 = leftExt.length + BASE_L0;
const ALL_Q  = ALL.map(s => [s.x0, s.tl, s.x1, s.tr, s.x1, s.br, s.x0, s.bl]);
const stage = document.getElementById('stage');
const hint  = document.getElementById('hint');
const count = document.getElementById('count');
const N = TOTAL_PAGES;
const params = new URLSearchParams(location.search);
const REF_MODE = params.has('ref');
if (params.has('outline')) stage.classList.add('dbg');
const leaves = [];
function loadImg(el, i){
  if (el._loaded) return;
  el._loaded = true;
  const img = el._img;
  img.onerror = () => { img.remove(); el.classList.add('empty'); el.insertBefore(document.createTextNode(String(i + 1).padStart(2,'0')), el.firstChild); };
  img.src = src(i + 1);
}
for (let i = 0; i < N; i++){
  const el = document.createElement('div');
  el.className = 'leaf';
  const img = new Image();
  img.alt = 'Diseño ' + (i + 1); img.decoding = 'async'; img.draggable = false;
  el._img = img;
  el.appendChild(img);
  const sh = document.createElement('div'); sh.className = 'sh'; el.appendChild(sh);
  const lit = document.createElement('div'); lit.className = 'lit'; el.appendChild(lit);
  const edge = document.createElement('div'); edge.className = 'edge'; el.appendChild(edge);
  el._sh = sh; el._lit = lit; el._i = i; el._loaded = false; el.style.display = 'none';
  stage.appendChild(el); leaves.push(el);
}
/* precarga solo las primeras 3 (apertura en pág. 1) */
for (let i = 0; i < Math.min(3, N); i++) loadImg(leaves[i], i);
let refEl = null;
if (REF_MODE){
  refEl = new Image(); refEl.className = 'ref';
  refEl.src = params.get('ref') || 'img/ref.png';
  refEl.onload = () => refEl.style.display = 'block';
  refEl.style.opacity = params.get('o') || '.5';
  stage.appendChild(refEl);
}
function matrix(q){
  const [x0,y0,x1,y1,x2,y2,x3,y3] = q;
  const dx1 = x1 - x2, dx2 = x3 - x2, sx = x0 - x1 + x2 - x3;
  const dy1 = y1 - y2, dy2 = y3 - y2, sy = y0 - y1 + y2 - y3;
  let a,b,c,d,e,f,g,h;
  if (Math.abs(sx) < 1e-9 && Math.abs(sy) < 1e-9){
    a = x1 - x0; b = x2 - x1; c = x0; d = y1 - y0; e = y2 - y1; f = y0; g = 0; h = 0;
  } else {
    const den = dx1 * dy2 - dx2 * dy1;
    g = (sx * dy2 - dx2 * sy) / den;
    h = (dx1 * sy - sx * dy1) / den;
    a = x1 - x0 + g * x1; b = x3 - x0 + h * x3; c = x0;
    d = y1 - y0 + g * y1; e = y3 - y0 + h * y3; f = y0;
  }
  return `matrix3d(${a/PAGE_W},${d/PAGE_W},0,${g/PAGE_W},${b/PAGE_H},${e/PAGE_H},0,${h/PAGE_H},0,0,1,0,${c},${f},0,1)`;
}
let K = 1, OX = 0, OY = 0;
function layout(){
  const vw = innerWidth, vh = innerHeight;
  const scale = vw < 700 ? SCALE_MOBILE : SCALE_DESKTOP;
  K = Math.min(vw / REF_W, vh / REF_H) * scale;
  const cx = (CENTER_BOOK && !REF_MODE) ? SPINE_X : REF_W / 2;
  const cy = (CENTER_BOOK && !REF_MODE) ? BOOK_CY : REF_H / 2;
  OX = vw / 2 - cx * K;
  OY = vh / 2 - cy * K;
  if (refEl){ refEl.style.transform = `translate(${OX}px,${OY}px)`; refEl.style.width = REF_W * K + 'px'; refEl.style.height = REF_H * K + 'px'; }
  /* menor perLeaf = más recorrido por píxel de swipe (más sensible en móvil) */
  perLeaf = Math.max(48, Math.min(160, innerWidth * 0.14));
}
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function render(c){
  const last = ALL.length - 1;
  for (const el of leaves){
    const s = IDX_L0 + (el._i - c);
    if (s < 0 || s > last){ el.style.display = 'none'; continue; }
    loadImg(el, el._i);
    const k = Math.min(Math.floor(s), last - 1), f = s - k;
    const A = ALL_Q[k], B = ALL_Q[k + 1];
    /* ancho de la ranura en coords de referencia: si es muy fino, el dibujo se alarga */
    const slotW = Math.abs(lerp(A[0], B[0], f) - lerp(A[2], B[2], f));
    if (slotW < MIN_SLOT_W){ el.style.display = 'none'; continue; }
    const q = new Array(8);
    for (let j = 0; j < 8; j++){
      const v = lerp(A[j], B[j], f);
      q[j] = (j % 2 === 0) ? OX + v * K : OY + v * K;
    }
    const sa = ALL[k].sh, sb = ALL[k + 1].sh;
    let g = 'linear-gradient(to right';
    for (let j = 0; j < 5; j++) g += `,rgba(0,0,0,${(lerp(sa[j], sb[j], f) * 1.15).toFixed(3)}) ${SH_POS[j] * 100}%`;
    g += ')';
    const lam = clamp(IDX_L0 + 1 - s, 0, 1); // 1 = izquierda del lomo
    const rl = (RADIUS * lam).toFixed(1) + 'px', rr = (RADIUS * (1 - lam)).toFixed(1) + 'px';
    /* luz: más clara lejos del lomo, highlight superior suave (como foto con luz frontal) */
    const litG = lam > .5
      ? `linear-gradient(105deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.06) 42%, rgba(0,0,0,.10) 100%)`
      : `linear-gradient(255deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.06) 42%, rgba(0,0,0,.10) 100%)`;
    el.style.display = 'block';
    el.style.transform = matrix(q);
    el.style.borderRadius = `${rl} ${rr} ${rr} ${rl}`;
    el._sh.style.background = g;
    el._lit.style.background = litG;
    el.style.opacity = lerp(ALL[k].op, ALL[k + 1].op, f).toFixed(3);
    el.style.zIndex = 1000 - Math.round(Math.abs(s - (IDX_L0 + .5)) * 10);
  }
  const L = clamp(Math.round(c), 0, N - 2);
  count.textContent = String(L + 1).padStart(2,'0') + '–' + String(L + 2).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
}
const MIN = 0, MAX = N - 2;
let pos = clamp(START, MIN, MAX), vel = 0, target = pos, dragging = false, running = false, lastT = 0, perLeaf = 120;
function loop(t){
  let dt = Math.min(0.05, (t - lastT) / 1000 || 0.016); lastT = t;
  while (dt > 0){
    const h = Math.min(dt, 1 / 120); dt -= h;
    const a = (target - pos) * SPRING_K - vel * SPRING_C;
    vel += a * h; pos += vel * h;
  }
  if (!dragging && Math.abs(target - pos) < 0.0004 && Math.abs(vel) < 0.002){ pos = target; vel = 0; }
  render(pos);
  if (dragging || pos !== target) requestAnimationFrame(loop); else running = false;
}
function wake(){ if (!running){ running = true; lastT = performance.now(); requestAnimationFrame(loop); } }
function goTo(v){ target = clamp(Math.round(v), MIN, MAX); used(); wake(); }
function used(){ hint.classList.add('off'); }
const rubber = v => v < MIN ? MIN + (v - MIN) * .35 : v > MAX ? MAX + (v - MAX) * .35 : v;
let startX = 0, startY = 0, startPos = 0, moved = 0, samples = [], downEl = null;
stage.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; downEl = e.target.closest('.leaf');
  startX = e.clientX; startY = e.clientY; startPos = target;
  samples = [{x: e.clientX, t: e.timeStamp}];
  stage.setPointerCapture(e.pointerId);
  stage.classList.add('drag'); wake();
});
stage.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - startX;
  moved = Math.max(moved, Math.abs(dx), Math.abs(e.clientY - startY));
  target = rubber(startPos - dx / perLeaf);
  samples.push({x: e.clientX, t: e.timeStamp}); if (samples.length > 6) samples.shift();
  if (moved > 6) used();
});
function endDrag(){
  if (!dragging) return;
  dragging = false; stage.classList.remove('drag');
  if (moved < 8){
    if (downEl && !downEl.classList.contains('empty')){
      openLb(downEl._i);
    } else wake();
    return;
  }
  const a = samples[0], b = samples[samples.length - 1];
  const vx = (b.t - a.t) > 0 ? (b.x - a.x) / (b.t - a.t) : 0;
  const projected = target - (vx * 1000 / perLeaf) * FLICK_T;
  const from = Math.round(startPos);
  goTo(clamp(Math.round(projected), from - MAX_JUMP, from + MAX_JUMP));
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
let wheelT = 0;
stage.addEventListener('wheel', e => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  target = rubber(target + e.deltaX / (perLeaf * 1.4)); used(); wake();
  clearTimeout(wheelT); wheelT = setTimeout(() => goTo(target), 140);
}, {passive: false});
addEventListener('keydown', e => {
  if (lb.classList.contains('on')){ if (e.key === 'Escape') closeLb(); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(target + 1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(target - 1);
});
/* lightbox */
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbCap = document.getElementById('lbCap');
const lbClose = document.getElementById('lbClose');
function openLb(i){
  used();
  lbImg.src = src(i + 1);
  lbImg.alt = 'Diseño ' + (i + 1);
  lbCap.textContent = String(i + 1).padStart(2,'0') + ' / ' + String(N).padStart(2,'0');
  lb.hidden = false;
  requestAnimationFrame(() => lb.classList.add('on'));
}
function closeLb(){
  lb.classList.remove('on');
  setTimeout(() => { if (!lb.classList.contains('on')){ lb.hidden = true; lbImg.removeAttribute('src'); } }, 300);
}
lbClose.addEventListener('click', e => { e.stopPropagation(); closeLb(); });
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
lb.addEventListener('pointerdown', e => e.stopPropagation());
/* iOS: bloquear bounce / rubber-band del documento */
document.addEventListener('touchmove', e => {
  if (e.target.closest && (e.target.closest('a.back') || e.target.closest('.lb'))) return;
  e.preventDefault();
}, {passive: false});
addEventListener('resize', () => { layout(); render(pos); });
if (window.visualViewport){
  visualViewport.addEventListener('resize', () => { layout(); render(pos); });
}
layout(); render(pos);
</script>
</body>
</html>
